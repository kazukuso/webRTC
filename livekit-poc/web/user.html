<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>利用者 - 通訳コールセンター</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script src="/call.js"></script>
<script src="/lkbg/track-processors.min.js"></script>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin:0; background:#f5f6f8; color:#222; }
  header { background:#1f4e79; color:#fff; padding:12px 18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
  header .who{ font-size:12px; font-weight:normal; }
  header .who a{ color:#cfe0f5; margin-left:10px; }
  .wrap { max-width:1280px; margin:20px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid #e2e5ea; border-radius:10px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:#555; margin:10px 0 6px; }
  select { width:100%; padding:12px; border:1px solid #cfd4dc; border-radius:8px; font-size:16px; background:#fff; }
  button { border:0; border-radius:8px; padding:12px 18px; font-size:15px; cursor:pointer; }
  .primary { background:#1f4e79; color:#fff; width:100%; margin-top:16px; } .ghost { background:#eef1f5; color:#333; } .danger { background:#b3261e; color:#fff; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .videos { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:14px; }
  #formCard,#waitCard{ max-width:680px; margin-left:auto; margin-right:auto; }
  figure { margin:0; background:#000; border-radius:10px; overflow:hidden; position:relative; aspect-ratio:4/3; max-height:76vh; }
  figure video { width:100%; height:100%; object-fit:cover; }
  figure figcaption { position:absolute; left:8px; bottom:8px; color:#fff; font-size:12px; background:rgba(0,0,0,.5); padding:2px 8px; border-radius:6px; }
  .wait { text-align:center; padding:30px 10px; } .wait .big{ font-size:44px; font-weight:bold; color:#1f4e79; }
  .hidden { display:none; } #msg,#waitMsg { font-size:13px; color:#666; margin-top:10px; min-height:18px; }
  .gps{ font-size:13px; color:#555; margin-top:12px; }
</style>
</head>
<body>
<header>利用者受付 <span class="who"><span id="who"></span><a href="/help/user.html" target="_blank">ヘルプ</a> <a href="#" id="logout">ログアウト</a></span></header>
<div class="wrap">

  <div class="card" id="formCard">
    <label>ご希望の言語を選んでください / Select language</label>
    <select id="language"></select>
    <div class="gps hidden" id="gpsWrap">
      <label style="margin:0;"><input type="checkbox" id="useGps"> 現在地を送信する（任意・市区町村の記録に使用。ブラウザの許可が必要）</label>
    </div>
    <button class="primary" id="joinBtn">通訳を呼ぶ</button>
    <div id="msg"></div>
    <div id="cardStatus" class="hidden" style="margin-top:12px;font-size:13px;color:#333;padding:10px;border:1px solid #e2e5ea;border-radius:8px;background:#fafbfc;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <span id="cardText"></span>
      <button class="ghost" id="cardBtn">カード登録</button>
    </div>
  </div>

  <div class="card hidden" id="waitCard">
    <div class="wait">
      <div>順番をお待ちください（<span id="waitLang">-</span>）</div>
      <div class="big"><span id="pos">-</span> 番目</div>
      <div style="color:#666;font-size:13px;">担当が空き次第、自動的に通話が始まります</div>
    </div>
    <div class="controls" style="justify-content:center;"><button class="ghost" id="cancelBtn">キャンセル</button></div>
  </div>

  <div class="card hidden" id="callCard">
    <div class="videos">
      <figure><video id="localVideo" autoplay muted playsinline></video><figcaption>自分</figcaption></figure>
      <div id="remotes" style="display:contents;"></div>
    </div>
    <div id="waitMsg"></div>
    <div id="billBar" class="hidden" style="margin-top:10px;padding:10px 12px;background:#fff8e6;border:1px solid #f0d98a;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <span id="billText" style="font-size:14px;"></span>
      <button class="primary" id="extendBtn" style="width:auto;margin:0;padding:8px 16px;">延長する（+¥<span id="extPrice">0</span>）</button>
    </div>
    <div class="controls">
      <button class="ghost" id="micBtn">マイク オフ</button>
      <button class="ghost" id="camBtn">カメラ オフ</button>
      <button class="ghost hidden" id="switchCamBtn">カメラ切替</button>
      <span id="bgCtrl" class="hidden" style="display:inline-flex;gap:6px;align-items:center;">
        <span style="font-size:12px;color:#555;">背景:</span>
        <button class="ghost" id="bgOff">なし</button>
        <button class="ghost" id="bgBlur">ぼかし</button>
        <button class="ghost" id="bgImg1">背景1</button>
        <button class="ghost" id="bgImg2">背景2</button>
      </span>
      <button class="danger" id="leaveBtn">退室</button>
    </div>
  </div>

</div>
<script>
const $ = (id)=>document.getElementById(id);
const token=localStorage.getItem('authToken');
let me=null, sessionId=null, polling=null, connected=false, hb=null, bill=null, billTick=null;

// 認証チェック＋アカウント情報取得
(async ()=>{
  if(!token){ location.href='/'; return; }
  const r=await fetch('/api/auth/me',{headers:{'x-auth-token':token}});
  if(!r.ok){ localStorage.removeItem('authToken'); location.href='/'; return; }
  me=await r.json();
  if(me.role!=='user'){ location.href='/'; return; }
  $("who").textContent=me.displayName+'（'+(me.mode==='B'?'パターンB':'パターンA')+'）';
  if(me.mode==='B') $("gpsWrap").classList.remove('hidden');
  const list=await (await fetch('/api/languages')).json();
  $("language").innerHTML=list.map(l=>`<option value="${l.code}">${l.label}</option>`).join('');
  await refreshCard();
  const cp=new URLSearchParams(location.search).get('card');
  if(cp==='ok') $("msg").textContent='カードを登録しました。';
  else if(cp==='cancel') $("msg").textContent='カード登録をキャンセルしました。';
})();

function getGpsLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(async pos=>{
      const {latitude:la, longitude:lo, accuracy:ac}=pos.coords; let loc=null;
      try{ const d=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=ja`)).json();
        loc=[d.principalSubdivision, d.city||d.locality].filter(Boolean).join(' ')||null; }catch(_){}
      resolve({location:loc, lat:la, lon:lo, acc:ac});
    }, _=>resolve(null), {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  });
}

async function join(){
  const language=$("language").value; if(!language){ $("msg").textContent="言語を選んでください"; return; }
  let gps=null;
  if(me.mode==='B' && $("useGps").checked){ $("msg").textContent="現在地を取得中...（許可ダイアログに応答してください）"; gps=await getGpsLocation(); }
  $("msg").textContent="受付中...";
  const resp=await fetch("/api/user/join",{method:"POST",headers:{"Content-Type":"application/json","x-auth-token":token},
    body:JSON.stringify({language, gpsLocation:gps&&gps.location, gpsLat:gps&&gps.lat, gpsLon:gps&&gps.lon, gpsAcc:gps&&gps.acc})});
  const data=await resp.json();
  if(!resp.ok){ $("msg").textContent=data.error||"受付に失敗しました"; if(data.needCard){ await refreshCard(); $("cardStatus").classList.remove("hidden"); } return; }
  sessionId=data.sessionId;
  $("formCard").classList.add("hidden"); $("waitCard").classList.remove("hidden");
  polling=setInterval(poll,1500); poll();
}
async function poll(){
  if(!sessionId||connected) return;
  const s=await (await fetch("/api/user/status?sessionId="+encodeURIComponent(sessionId))).json();
  if(s.status==="waiting"){ $("pos").textContent=s.position; $("waitLang").textContent=s.language; }
  else if(s.status==="preparing"){ $("pos").textContent="…"; $("waitLang").textContent="決済処理中"; }
  else if(s.status==="payment_failed"){ clearInterval(polling); const m=s.error||"決済に失敗しました"; backToForm(); $("msg").textContent=m; await refreshCard(); $("cardStatus").classList.remove("hidden"); }
  else if(s.status==="assigned"){
    connected=true; clearInterval(polling);
    $("waitCard").classList.add("hidden"); $("callCard").classList.remove("hidden");
    if(s.guidePending) $("waitMsg").textContent="通訳者と接続しました。案内人が参加します…";
    await CallUI.connect(s.url, s.token, {localVideo:$("localVideo"), remoteContainer:$("remotes")});
    try{ const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"); if(cams.length>1) $("switchCamBtn").classList.remove("hidden"); }catch(_){}
    if(CallUI.bgSupported && CallUI.bgSupported()) $("bgCtrl").classList.remove("hidden");
    if(s.guidePending) setTimeout(()=>{ $("waitMsg").textContent=""; }, 8000);
    setBilling(s.billing); startBillTick();
    hb=setInterval(()=>{ fetch("/api/user/status?sessionId="+encodeURIComponent(sessionId)).then(r=>r.json())
      .then(x=>{ if(!x) return;
        if(x.status!=='assigned'&&x.status!=='waiting'){ endCall((bill&&bill.remainingSec<=0)?"通話が終了しました（ご利用時間の終了）":""); return; }
        if(x.billing) setBilling(x.billing);
      }).catch(()=>{}); }, 5000);
  }
}
function backToForm(){ if(sessionId){ try{ fetch("/api/user/leave",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","x-auth-token":token},body:JSON.stringify({sessionId})}); }catch(_){} } clearInterval(polling); clearInterval(hb); clearInterval(billTick); CallUI.disconnect(); sessionId=null; connected=false; bill=null;
  $("billBar").classList.add("hidden"); $("switchCamBtn").classList.add("hidden"); $("bgCtrl").classList.add("hidden");
  $("callCard").classList.add("hidden"); $("waitCard").classList.add("hidden"); $("formCard").classList.remove("hidden"); $("msg").textContent=""; }

function toast(msg){ const el=$("waitMsg"); if(!el) return; el.textContent=msg; clearTimeout(window.__toastT); window.__toastT=setTimeout(()=>{ if($("waitMsg")) $("waitMsg").textContent=""; },4000); }
function setBilling(b){ bill=(b&&b.required)?b:null; if(bill) $("extPrice").textContent=bill.extPrice; updateBillUI(); }
function updateBillUI(){
  if(!bill){ $("billBar").classList.add("hidden"); return; }
  $("billBar").classList.remove("hidden");
  const rem=Math.max(0,bill.remainingSec|0), m=Math.floor(rem/60), sec=rem%60;
  const warn=rem<=60?'　まもなく終了します':'';
  $("billText").innerHTML=`残り <b>${m}:${String(sec).padStart(2,"0")}</b> ／ 現在の料金 ¥${bill.chargeTotal}（延長 +¥${bill.extPrice}／${bill.extUnitMin}分）<span style="color:#b3261e">${warn}</span>`;
}
function startBillTick(){ clearInterval(billTick); billTick=setInterval(()=>{ if(bill){ bill.remainingSec=Math.max(0,(bill.remainingSec|0)-1); updateBillUI(); } },1000); }
async function extend(){
  if(!sessionId || !bill) return; $("extendBtn").disabled=true;
  try{
    const r=await fetch("/api/user/extend",{method:"POST",headers:{"Content-Type":"application/json","x-auth-token":token},body:JSON.stringify({sessionId})});
    const d=await r.json();
    if(!r.ok){ toast(d.error||"延長できませんでした"); return; }
    if(bill){ bill.remainingSec=d.remainingSec; bill.chargeTotal=d.chargeTotal; bill.extPrice=d.extPrice; bill.extUnitMin=d.extUnitMin; updateBillUI(); }
  }catch(_){ toast("延長に失敗しました"); }
  finally{ $("extendBtn").disabled=false; }
}
function endCall(msg){ clearInterval(hb); clearInterval(billTick); CallUI.disconnect(); backToForm(); if(msg) $("msg").textContent=msg; }

async function refreshCard(){
  try{
    const c=await (await fetch('/api/user/card',{headers:{'x-auth-token':token}})).json();
    if(!c.enabled){ $("cardStatus").classList.add('hidden'); return; }
    $("cardStatus").classList.remove('hidden');
    if(c.registered){ $("cardText").textContent='お支払いカード: '+(c.brand||'カード')+' ****'+(c.last4||'')+'（登録済み）'; $("cardBtn").textContent='カード変更'; }
    else { $("cardText").textContent='お支払いカードが未登録です。通話の前に登録してください。'; $("cardBtn").textContent='カード登録'; }
  }catch(_){}
}
async function registerCard(){
  $("cardBtn").disabled=true;
  try{
    const r=await fetch('/api/user/card/session',{method:'POST',headers:{'Content-Type':'application/json','x-auth-token':token}});
    const d=await r.json();
    if(!r.ok||!d.url){ alert(d.error||'カード登録を開始できませんでした'); return; }
    location.href=d.url;
  }catch(_){ alert('カード登録の開始に失敗しました'); }
  finally{ $("cardBtn").disabled=false; }
}

$("joinBtn").onclick=join;
$("cancelBtn").onclick=backToForm;
$("leaveBtn").onclick=backToForm;
$("extendBtn").onclick=extend;
$("cardBtn").onclick=registerCard;
$("micBtn").onclick=()=>CallUI.toggleMic($("micBtn"));
$("camBtn").onclick=()=>CallUI.toggleCam($("camBtn"),$("localVideo"));
$("switchCamBtn").onclick=async()=>{ try{ await CallUI.switchCamera($("localVideo")); }catch(e){ toast("カメラ切替に失敗しました（対応端末をご確認ください）"); } };
const applyBg=async(m,u)=>{ try{ await CallUI.setBackground(m,u); }catch(e){ toast("背景処理を適用できませんでした（端末により未対応の場合あり）"); } };
$("bgOff").onclick=()=>applyBg("off");
$("bgBlur").onclick=()=>applyBg("blur");
$("bgImg1").onclick=()=>applyBg("image","/lkbg/bg1.jpg");
$("bgImg2").onclick=()=>applyBg("image","/lkbg/bg2.jpg");
window.addEventListener("pagehide",()=>{ if(sessionId){ try{ fetch("/api/user/leave",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","x-auth-token":token},body:JSON.stringify({sessionId})}); }catch(_){} } });
$("logout").onclick=async(e)=>{ e.preventDefault(); try{await fetch('/api/auth/logout',{method:'POST',headers:{'x-auth-token':token}});}catch(_){} localStorage.removeItem('authToken'); location.href='/'; };
</script>
</body>
</html>
