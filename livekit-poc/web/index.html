<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ログイン - 通訳コールセンター</title>
<style>
  body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;background:#eef1f5;color:#1a2330;}
  .wrap{max-width:380px;margin:12vh auto;padding:0 16px;}
  .card{background:#fff;border:1px solid #dfe3ea;border-radius:12px;padding:26px 22px;box-shadow:0 6px 24px rgba(31,78,121,.08);}
  h1{font-size:18px;color:#1f4e79;margin:0 0 4px;}
  .sub{font-size:12px;color:#66707d;margin-bottom:18px;}
  label{display:block;font-size:13px;color:#555;margin:10px 0 4px;}
  input{width:100%;padding:10px;border:1px solid #cfd6e0;border-radius:8px;font-size:14px;}
  button{width:100%;margin-top:16px;border:0;border-radius:8px;padding:11px;background:#1f4e79;color:#fff;font-size:15px;cursor:pointer;}
  #msg{font-size:13px;color:#b3261e;margin-top:10px;min-height:18px;}
  .demo{margin-top:16px;font-size:11px;color:#8a94a3;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>通訳コールセンター</h1>
    <div class="sub">ユーザー名とパスワードでログイン</div>
    <label>ユーザー名</label>
    <input id="username" autocomplete="username" />
    <label>パスワード</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn">ログイン</button>
    <div id="msg"></div>
    <div class="demo">デモ用: admin / reception1 / int_en / guide1（パスワードは各ユーザー名と同じ。本番は変更）</div>
  </div>
</div>
<script>
const $=(id)=>document.getElementById(id);
const dest=(role)=>({admin:'/admin.html',interpreter:'/staff.html',guide:'/staff.html',user:'/user.html'}[role]||'/');
async function login(){
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});
  const d=await r.json();
  if(!r.ok){ $("msg").textContent=d.error||'ログインに失敗しました'; return; }
  localStorage.setItem('authToken',d.token); localStorage.setItem('authRole',d.role);
  location.href=dest(d.role);
}
$("loginBtn").onclick=login;
$("password").addEventListener('keydown',e=>{if(e.key==='Enter')login();});
// 既ログインなら振り分け
const t=localStorage.getItem('authToken');
if(t){ fetch('/api/auth/me',{headers:{'x-auth-token':t}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{location.href=dest(d.role);}).catch(()=>{localStorage.removeItem('authToken');}); }
</script>
</body>
</html>
