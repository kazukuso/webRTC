<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>通訳コールセンター PoC</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin:0; background:#f5f6f8; color:#222; }
  header { background:#1f4e79; color:#fff; padding:14px 20px; font-weight:bold; font-size:18px; }
  .wrap { max-width:820px; margin:36px auto; padding:0 16px; }
  .cards { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  a.card { display:block; background:#fff; border:1px solid #e2e5ea; border-radius:12px; padding:22px 18px; text-decoration:none; color:#222; transition:.15s; }
  a.card:hover { border-color:#1f4e79; box-shadow:0 4px 14px rgba(31,78,121,.12); }
  a.card h2 { margin:0 0 8px; color:#1f4e79; font-size:16px; }
  a.card p { margin:0; font-size:12.5px; color:#666; line-height:1.6; }
  .note { margin-top:20px; font-size:13px; color:#777; background:#fff; border:1px solid #e2e5ea; border-radius:10px; padding:14px 16px; line-height:1.7; }
  @media (max-width:640px){ .cards { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>通訳コールセンター PoC（言語別ルーティング / パターンA・B）</header>
<div class="wrap">
  <div class="cards">
    <a class="card" href="/user.html">
      <h2>① 利用者（発信端末）</h2>
      <p>端末モード(A/B)を設定し、必要言語を選んで受付。通訳者（Bは案内人も）を呼び出します。</p>
    </a>
    <a class="card" href="/staff.html?role=interpreter">
      <h2>② 通訳者</h2>
      <p>対応言語を選んでログイン。選択言語の待機者を言語別に自動着信します。</p>
    </a>
    <a class="card" href="/staff.html?role=guide">
      <h2>③ 案内人</h2>
      <p>言語不問の共通プール。パターンBの通話に通訳者と併せて参加します。</p>
    </a>
  </div>
  <div class="note">
    <b>動作例</b>：②通訳者（例: 英語）と ③案内人 を各タブでログイン→応対可。
    ①利用者で「パターンB／英語」を選び受付すると、通訳者＋案内人＋利用者の3者通話に。<br>
    パターンAなら通訳者だけを呼び出し（2接続）。端末コードは <b>1234</b>。
  </div>
</div>
</body>
</html>
