<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>スタッフ - 通訳コールセンター</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script src="/call.js"></script>
<script src="/lkbg/track-processors.min.js"></script>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin:0; background:#f5f6f8; color:#222; }
  header { background:#0d3b66; color:#fff; padding:12px 18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
  header .who{ font-size:12px; font-weight:normal; } header .who a{ color:#cfe0f5; margin-left:10px; }
  .wrap { max-width:1280px; margin:20px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid #e2e5ea; border-radius:10px; padding:18px; margin-bottom:16px; }
  button { border:0; border-radius:7px; padding:10px 16px; font-size:14px; cursor:pointer; }
  .primary { background:#0d3b66; color:#fff; } .ghost { background:#eef1f5; color:#333; } .danger { background:#b3261e; color:#fff; } .ok { background:#1a7f37; color:#fff; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .status { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .pill { font-size:13px; padding:4px 12px; border-radius:20px; background:#eef1f5; }
  .pill.avail { background:#dff5e3; color:#1a7f37; } .pill.busy { background:#fde7e7; color:#b3261e; }
  .videos { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:14px; }
  #consoleCard{ max-width:680px; margin-left:auto; margin-right:auto; }
  figure { margin:0; background:#000; border-radius:10px; overflow:hidden; position:relative; aspect-ratio:4/3; max-height:76vh; }
  figure video { width:100%; height:100%; object-fit:cover; }
  figure figcaption { position:absolute; left:8px; bottom:8px; color:#fff; font-size:12px; background:rgba(0,0,0,.5); padding:2px 8px; border-radius:6px; }
  .hidden { display:none; } #msg2,#recMsg { font-size:13px; color:#666; margin-top:8px; }
  #waitList table{border-collapse:collapse;width:100%;margin-top:4px;}
  #waitList th,#waitList td{border:1px solid #e3e7ee;padding:6px 8px;text-align:left;font-size:13px;}
  #waitList th{background:#f2f5f9;}
  #waitList .ok{padding:5px 14px;}
  #waitList .empty{color:#666;font-size:13px;padding:6px 2px;}
</style>
</head>
<body>
<header id="hdr">スタッフ コンソール <span class="who"><span id="who"></span><a href="#" id="helpLink" target="_blank">ヘルプ</a> <a href="#" id="logout">ログアウト</a></span></header>
<div class="wrap">

  <div class="card" id="consoleCard">
    <div class="status">
      <div>状態: <span class="pill" id="statePill">-</span></div>
      <div id="waitInfo" style="font-size:13px;color:#444;"></div>
      <button class="ok" id="availBtn">応対可にする</button>
      <button class="ghost" id="offBtn">離席</button>
    </div>
    <div id="waitList" style="margin-top:14px;"></div>
    <div id="listMsg" style="color:#b3261e;font-size:13px;margin-top:6px;min-height:16px;"></div>
    <div id="msg2">「応対可」にすると自動で着信します。</div>
  </div>

  <div class="card hidden" id="callCard">
    <div style="margin-bottom:10px;" id="callInfo">対応中</div>
    <div class="videos">
      <figure><video id="localVideo" autoplay muted playsinline></video><figcaption>自分</figcaption></figure>
      <div id="remotes" style="display:contents;"></div>
    </div>
    <div class="controls">
      <button class="ghost" id="micBtn">マイク オフ</button>
      <button class="ghost" id="camBtn">カメラ オフ</button>
      <span id="bgCtrl" class="hidden" style="display:inline-flex;gap:6px;align-items:center;">
        <span style="font-size:12px;color:#555;">背景:</span>
        <button class="ghost" id="bgOff">なし</button>
        <button class="ghost" id="bgBlur">ぼかし</button>
        <button class="ghost" id="bgImg1">背景1</button>
        <button class="ghost" id="bgImg2">背景2</button>
      </span>
      <button class="danger" id="hangupBtn">通話終了</button>
    </div>
    <div id="recMsg"></div>
  </div>

</div>
<script>
const $ = (id)=>document.getElementById(id);
const token=localStorage.getItem('authToken');
const AH={'Content-Type':'application/json','x-auth-token':token};
const esc=(v)=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function setListMsg(m){ const el=$("listMsg"); if(el){ el.textContent=m||''; if(m){ clearTimeout(window.__lm); window.__lm=setTimeout(()=>{ if($("listMsg")) $("listMsg").textContent=''; },4000);} } }
function renderList(d){
  const box=$("waitList"); if(!box) return;
  if(d.status!=='available'){ box.innerHTML='<div class="empty">「応対可にする」を押すと、待機中の通話一覧が表示されます。</div>'; return; }
  const rows = (role==='guide') ? (d.guideList||[]) : (d.waitingList||[]);
  if(!rows.length){ box.innerHTML='<div class="empty">現在、待機中の通話はありません。</div>'; return; }
  let h='<table>';
  h += (role==='guide')
    ? '<tr><th>顧客</th><th>言語</th><th>通訳者</th><th>地域</th><th></th></tr>'
    : '<tr><th>顧客</th><th>言語</th><th>種別</th><th>地域</th><th>待ち</th><th></th></tr>';
  for(const r of rows){
    const b='<button class="ok" onclick="accept(\''+r.sessionId+'\')">'+(role==='guide'?'参加':'応答')+'</button>';
    h += (role==='guide')
      ? `<tr><td>${esc(r.name)}</td><td>${esc(r.language)}</td><td>${esc(r.interpreter)||'-'}</td><td>${esc(r.location)||'-'}</td><td>${b}</td></tr>`
      : `<tr><td>${esc(r.name)}</td><td>${esc(r.language)}</td><td>${r.mode||''}</td><td>${esc(r.location)||'-'}</td><td>${r.waitSec}s</td><td>${b}</td></tr>`;
  }
  h+='</table>';
  box.innerHTML=h;
}
async function accept(sid){
  try{
    const r=await fetch('/api/staff/accept',{method:'POST',headers:AH,body:JSON.stringify({sessionId:sid})});
    const d=await r.json();
    if(!r.ok){ setListMsg(d.error||'応答できませんでした'); poll(); return; }
    poll(); // 対応中(busy)になり通話へ自動遷移
  }catch(_){ setListMsg('通信エラー'); }
}
let me=null, role=null, polling=null, inCall=false, recording=false;

(async ()=>{
  if(!token){ location.href='/'; return; }
  const r=await fetch('/api/auth/me',{headers:{'x-auth-token':token}});
  if(!r.ok){ localStorage.removeItem('authToken'); location.href='/'; return; }
  me=await r.json(); role=me.role;
  if(role!=='interpreter' && role!=='guide'){ location.href='/'; return; }
  $("hdr").firstChild.textContent=(role==='guide'?'案内人':'通訳者')+' コンソール ';
  $("helpLink").href = (role==='guide'?'/help/guide.html':'/help/interpreter.html');
  $("who").textContent=me.displayName+(role==='interpreter'?'（'+(me.languages||[]).join(',')+'）':'');
  setState("available"); setStatus("available");
  polling=setInterval(poll,1500); poll();
})();

async function setStatus(status){
  const d=await (await fetch("/api/staff/status",{method:"POST",headers:AH,body:JSON.stringify({status})})).json();
  setState(d.status);
}
function setState(s){ const p=$("statePill"); p.textContent=s==="available"?"応対可":(s==="busy"?"対応中":"離席"); p.className="pill"+(s==="available"?" avail":(s==="busy"?" busy":"")); }

async function poll(){
  if(!token) return;
  let d; try{ d=await (await fetch("/api/staff/poll",{headers:{'x-auth-token':token}})).json(); }catch(_){ return; }
  if(inCall){
    if(d.assigned) return; // 通話継続中は生存通知のみ
    // 相手が退出/セッション終了 → コンソール(待機)へ自動復帰
    CallUI.disconnect(); inCall=false; recording=false;
    $("bgCtrl").classList.add("hidden");
    $("recMsg").textContent="";
    $("callCard").classList.add("hidden"); $("consoleCard").classList.remove("hidden");
    setState("available");
  }
  if(role==='guide') $("waitInfo").textContent="案内人待ちのB通話: "+(d.guideNeeded??0)+" 件";
  else if(d.waitingByLang) $("waitInfo").textContent="待機中: "+Object.entries(d.waitingByLang).map(([k,v])=>`${k}:${v}`).join(' / ');
  renderList(d);
  if(d.assigned){
    inCall=true; setState("busy");
    $("consoleCard").classList.add("hidden"); $("callCard").classList.remove("hidden");
    $("callInfo").textContent=`対応中: ${d.customer||'-'}（${d.language||''} / パターン${d.mode||''}）`;
    await CallUI.connect(d.url,d.token,{localVideo:$("localVideo"), remoteContainer:$("remotes")});
    if(CallUI.bgSupported && CallUI.bgSupported()) $("bgCtrl").classList.remove("hidden");
  } else setState(d.status);
}
async function hangup(){
  await fetch("/api/staff/hangup",{method:"POST",headers:AH,body:'{}'});
  CallUI.disconnect(); inCall=false; recording=false;
  $("bgCtrl").classList.add("hidden");
  $("recMsg").textContent="";
  $("callCard").classList.add("hidden"); $("consoleCard").classList.remove("hidden");
  setState("available"); poll();
}

$("availBtn").onclick=()=>setStatus("available");
$("offBtn").onclick=()=>setStatus("offline");
$("hangupBtn").onclick=hangup;
$("micBtn").onclick=()=>CallUI.toggleMic($("micBtn"));
$("camBtn").onclick=()=>CallUI.toggleCam($("camBtn"),$("localVideo"));
function toast(msg){ const el=$("recMsg"); if(el){ el.textContent=msg; clearTimeout(window.__t); window.__t=setTimeout(()=>{ if($("recMsg")) $("recMsg").textContent=""; },4000);} }
const applyBg=async(m,u)=>{ try{ await CallUI.setBackground(m,u); }catch(e){ toast("背景処理を適用できませんでした（端末により未対応の場合あり）"); } };
$("bgOff").onclick=()=>applyBg("off");
$("bgBlur").onclick=()=>applyBg("blur");
$("bgImg1").onclick=()=>applyBg("image","/lkbg/bg1.jpg");
$("bgImg2").onclick=()=>applyBg("image","/lkbg/bg2.jpg");
$("logout").onclick=async(e)=>{ e.preventDefault(); try{await fetch('/api/staff/status',{method:'POST',headers:AH,body:JSON.stringify({status:'offline'})});await fetch('/api/auth/logout',{method:'POST',headers:{'x-auth-token':token}});}catch(_){} localStorage.removeItem('authToken'); location.href='/'; };
</script>
</body>
</html>
